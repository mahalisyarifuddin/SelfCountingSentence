<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Self-Referential Sentence Generator</title>
	<style>
		/* =====================================================================
		   SHARED DESIGN CORE — identical in every app. Do not edit in place.
		   Edit /core.css, then run sync_core.py to push it to all apps.

		   Order: 1) tokens  2) reset/base  3) app shell  4) components.
		   App-specific rules go in the APP-SPECIFIC block below this one, so
		   they win on equal specificity without needing !important.
		   ===================================================================== */

		/* ---------- 1. Tokens: light (default) ----------
		   Style against these, never raw hex: every token has a dark twin, so
		   anything built from them themes itself for free. */
		:root {
			/* brand */
			--primary: #005dac;
			--on-primary: #ffffff;
			--hover: #00539a;
			--primary-container: #d4e3ff;
			--on-primary-container: #001c3a;

			/* surfaces */
			--background: #f9f9ff;
			--surface: #ffffff;
			--surface-variant: #f2f3fc;
			--muted: #f2f3fc;

			/* text */
			--text: #181c21;
			--text-muted: #5a6069;
			--text-secondary: #5a6069;

			/* lines */
			--border: #c1c6d4;
			--border-strong: #8f95a3;

			/* status */
			--success: #0b6b1d;
			--on-success: #ffffff;
			--success-bg: #d7f5d8;
			--danger: #ba1a1a;
			--error: #ba1a1a;
			--on-danger: #ffffff;
			--danger-bg: #ffdad6;
			--warning: #8a5000;
			--on-warning: #ffffff;
			--warning-bg: #ffedd5;
			--warning-text: #9a3412;
			--accent: #f57c00;
			--accent-bg: #fff8f0;
			--highlight-bg: #d4e3ff;

			/* elevation */
			--shadow-1: 0 1px 2px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .08);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .12);
			--scrim: rgba(0, 0, 0, .38);

			/* shape */
			--radius-sm: 4px;
			--radius: 8px;
			--radius-lg: 12px;
			--radius-pill: 999px;

			/* spacing scale */
			--sp-1: .25rem;
			--sp-2: .5rem;
			--sp-3: .75rem;
			--sp-4: 1rem;
			--sp-5: 1.5rem;
			--sp-6: 2rem;

			/* type */
			--font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

			/* layout — each app overrides this with its tier:
		   720 single-column · 960 standard · 1200 wide · 1600 dense/two-rail */
			--content-max: 960px;

			/* controls */
			--control-h: 42px;
		}

		/* ---------- 1b. Tokens: dark ----------
		   Duplicated on purpose: the media query serves "auto", the .dark class
		   serves an explicit choice. Change a value here and in .dark together. */
		@media (prefers-color-scheme: dark) {
			:root:not(.light) {
				--primary: #a5c8ff;
				--on-primary: #00315f;
				--hover: #72adff;
				--primary-container: #00468a;
				--on-primary-container: #d4e3ff;

				--background: #101319;
				--surface: #0b0e14;
				--surface-variant: #181c21;
				--muted: #181c21;

				--text: #e0e2ea;
				--text-muted: #a9b0bd;
				--text-secondary: #a9b0bd;

				--border: #414752;
				--border-strong: #6b7280;

				--success: #82db7e;
				--on-success: #00390a;
				--success-bg: #0b2a10;
				--danger: #ffb4ab;
				--error: #ffb4ab;
				--on-danger: #93000a;
				--danger-bg: #3b0907;
				--warning: #ffb95c;
				--on-warning: #3d2600;
				--warning-bg: #2b1c00;
				--warning-text: #ffd8a8;
				--accent: #ffb95c;
				--accent-bg: #1f1600;
				--highlight-bg: #001c3a;

				--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
				--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
				--scrim: rgba(0, 0, 0, .6);
			}
		}

		:root.dark {
			--primary: #a5c8ff;
			--on-primary: #00315f;
			--hover: #72adff;
			--primary-container: #00468a;
			--on-primary-container: #d4e3ff;

			--background: #101319;
			--surface: #0b0e14;
			--surface-variant: #181c21;
			--muted: #181c21;

			--text: #e0e2ea;
			--text-muted: #a9b0bd;
			--text-secondary: #a9b0bd;

			--border: #414752;
			--border-strong: #6b7280;

			--success: #82db7e;
			--on-success: #00390a;
			--success-bg: #0b2a10;
			--danger: #ffb4ab;
			--error: #ffb4ab;
			--on-danger: #93000a;
			--danger-bg: #3b0907;
			--warning: #ffb95c;
			--on-warning: #3d2600;
			--warning-bg: #2b1c00;
			--warning-text: #ffd8a8;
			--accent: #ffb95c;
			--accent-bg: #1f1600;
			--highlight-bg: #001c3a;

			--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
			--scrim: rgba(0, 0, 0, .6);
		}

		/* ---------- 2. Reset & base ----------
		   Headings are wrapped in :where() so they carry zero specificity — an
		   app can restyle h2 with a bare `h2 { }` and win. */
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html {
			-webkit-text-size-adjust: 100%;
		}

		body {
			background: var(--background);
			color: var(--text);
			font-family: var(--font-sans);
			font-size: 1rem;
			line-height: 1.5;
			min-height: 100vh;
			min-height: 100dvh;
			padding: var(--sp-5) var(--sp-4);
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			-webkit-font-smoothing: antialiased;
		}

		:where(h1, h2, h3, h4, h5, h6) {
			line-height: 1.25;
			font-weight: 600;
			text-wrap: balance;
		}

		:where(h1) { font-size: 1.5rem; }
		:where(h2) { font-size: 1.125rem; }
		:where(h3) { font-size: 1rem; }
		:where(h4, h5, h6) { font-size: .9375rem; }

		a {
			color: var(--primary);
			text-decoration-thickness: 1px;
			text-underline-offset: 2px;
		}

		:focus-visible {
			outline: 2px solid var(--primary);
			outline-offset: 2px;
			border-radius: var(--radius-sm);
		}

		::selection {
			background: var(--primary-container);
			color: var(--on-primary-container);
		}

		@media (prefers-reduced-motion: reduce) {
			*,
			*::before,
			*::after {
				animation-duration: .01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: .01ms !important;
				scroll-behavior: auto !important;
			}
		}

		/* ---------- 3. App shell ----------
		   Header and main share --content-max, so every app lines up on the same
		   optical column whatever its width tier.

		   No page footer exists here, on purpose. Decorative footers (app name,
		   source link, "runs in your browser") are omitted; anything genuinely
		   useful goes in a .disclosure at the end of .app-main. */
		.app-header,
		.app-main {
			width: 100%;
			max-width: var(--content-max);
			margin-inline: auto;
		}

		.app-header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: var(--sp-4);
			flex-wrap: wrap;
		}

		.app-title-group {
			flex: 1 1 16rem;
			display: flex;
			flex-direction: column;
			gap: var(--sp-1);
			min-width: 0;
		}

		.app-title-group h1 {
			font-size: 1.5rem;
			letter-spacing: -.01em;
		}

		.app-subtitle {
			color: var(--text-muted);
			font-size: .9375rem;
			max-width: 68ch;
		}

		.app-controls {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			flex-shrink: 0;
		}

		.app-main {
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			flex: 1;
		}

		/* ---------- 4. Components ---------- */

		/* The one surface primitive: every panel is a .card. Add .card-subtle
		   for a nested block that must read as *inside* another card. */
		.card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: var(--sp-5);
			min-width: 0;
		}

		.card > h2,
		.card-title {
			font-size: 1.125rem;
			margin-bottom: var(--sp-4);
		}

		.card-subtle {
			background: var(--surface-variant);
		}

		/* Buttons. The bare <button> element is the primary action, so most
		   markup needs no class. Add .secondary (outline), .danger, .ghost, or
		   .btn-icon (square, icon-only). Keep one primary per view. */
		button,
		.btn {
			font: inherit;
			font-weight: 500;
			line-height: 1.2;
			background: var(--primary);
			color: var(--on-primary);
			border: 1px solid transparent;
			border-radius: var(--radius);
			padding: 0 var(--sp-4);
			min-height: var(--control-h);
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: var(--sp-2);
			cursor: pointer;
			transition: background-color .15s, border-color .15s, color .15s;
		}

		button:hover,
		.btn:hover {
			background: var(--hover);
		}

		button:disabled,
		.btn:disabled {
			opacity: .5;
			cursor: not-allowed;
		}

		button.secondary,
		.btn-secondary {
			background: transparent;
			color: var(--primary);
			border-color: var(--border);
		}

		button.secondary:hover,
		.btn-secondary:hover {
			background: var(--surface-variant);
		}

		button.danger,
		.btn-danger {
			background: var(--danger);
			color: var(--on-danger);
		}

		button.danger:hover,
		.btn-danger:hover {
			filter: brightness(.92);
			background: var(--danger);
		}

		button.ghost,
		.btn-ghost {
			background: transparent;
			color: var(--text);
			border-color: transparent;
		}

		button.ghost:hover,
		.btn-ghost:hover {
			background: var(--surface-variant);
		}

		/* Square icon-only button — the Settings trigger and every dialog close.
		   Apps that make buttons full width must exclude it; see the
		   :not(:where(.btn-icon)) pattern in generator / OpenDensityTool. */
		.btn-icon {
			background: transparent;
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			width: var(--control-h);
			min-height: var(--control-h);
			padding: 0;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}

		.btn-icon:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.btn-icon svg {
			width: 20px;
			height: 20px;
			display: block;
		}

		/* Form controls. Inputs, selects and textareas are full width by design:
		   width is controlled by the .field / .row wrapper, not the control. */
		label {
			display: block;
			font-size: .875rem;
			font-weight: 500;
			color: var(--text);
			margin-bottom: var(--sp-1);
		}

		input,
		select,
		textarea {
			font: inherit;
			color: var(--text);
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-2) var(--sp-3);
			min-height: var(--control-h);
			width: 100%;
			max-width: 100%;
		}

		select {
			cursor: pointer;
			appearance: none;
			padding-right: 2rem;
			background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
				linear-gradient(135deg, currentColor 50%, transparent 50%);
			background-position: right 1.05rem center, right .8rem center;
			background-size: .3rem .3rem, .3rem .3rem;
			background-repeat: no-repeat;
		}

		textarea {
			min-height: 7rem;
			resize: vertical;
			line-height: 1.5;
		}

		input:hover,
		select:hover,
		textarea:hover {
			border-color: var(--border-strong);
		}

		input:focus,
		select:focus,
		textarea:focus {
			border-color: var(--primary);
		}

		input[type="checkbox"],
		input[type="radio"] {
			width: 1.125rem;
			height: 1.125rem;
			min-height: 0;
			accent-color: var(--primary);
			cursor: pointer;
			flex-shrink: 0;
		}

		input[type="range"] {
			padding: 0;
			min-height: 0;
			border: 0;
			background: transparent;
			accent-color: var(--primary);
		}

		input[type="color"] {
			padding: var(--sp-1);
			cursor: pointer;
		}

		input[type="file"] {
			padding: var(--sp-2);
		}

		input:disabled,
		select:disabled,
		textarea:disabled {
			background: var(--surface-variant);
			color: var(--text-muted);
			cursor: not-allowed;
		}

		/* Form layout. .field stacks one label + control; .row places fields side
		   by side. Set the column count on the row itself — style="--cols:3" —
		   and the responsive rules at the bottom handle the collapse. */
		.field {
			display: flex;
			flex-direction: column;
			min-width: 0;
			flex: 1;
		}

		.row {
			display: grid;
			grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
			gap: var(--sp-4);
			align-items: start;
		}

		.row-flex {
			display: flex;
			flex-wrap: wrap;
			gap: var(--sp-3);
			align-items: center;
		}

		.check {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			font-weight: 400;
			margin-bottom: 0;
			cursor: pointer;
		}

		.hint {
			color: var(--text-muted);
			font-size: .8125rem;
			margin-top: var(--sp-1);
		}

		/* Tabs. Mark the active one with .active AND aria-selected="true" so
		   assistive tech and the styling never disagree. */
		.tabs {
			display: flex;
			gap: var(--sp-1);
			border-bottom: 1px solid var(--border);
			overflow-x: auto;
			scrollbar-width: none;
		}

		.tabs::-webkit-scrollbar {
			display: none;
		}

		.tab {
			background: transparent;
			color: var(--text-muted);
			border: 0;
			border-bottom: 2px solid transparent;
			border-radius: var(--radius-sm) var(--radius-sm) 0 0;
			padding: 0 var(--sp-4);
			white-space: nowrap;
		}

		.tab:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.tab.active {
			color: var(--primary);
			border-bottom-color: var(--primary);
			background: transparent;
		}

		/* Tables. Cells never wrap; wrap the table in .table-wrap so wide data
		   scrolls sideways instead of bursting the card. */
		.table-wrap {
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			font-variant-numeric: tabular-nums;
		}

		th,
		td {
			text-align: left;
			padding: var(--sp-2) var(--sp-3);
			border-bottom: 1px solid var(--border);
			white-space: nowrap;
		}

		th {
			font-size: .8125rem;
			font-weight: 600;
			color: var(--text-muted);
			background: var(--surface-variant);
			position: sticky;
			top: 0;
		}

		tbody tr:last-child td {
			border-bottom: 0;
		}

		/* Small status pills. Use the semantic variant, not a colour name, so
		   meaning survives a palette change. */
		.badge {
			display: inline-flex;
			align-items: center;
			gap: var(--sp-1);
			font-size: .75rem;
			font-weight: 600;
			padding: var(--sp-1) var(--sp-2);
			border-radius: var(--radius-pill);
			background: var(--surface-variant);
			color: var(--text-muted);
			white-space: nowrap;
		}

		.badge-success { background: var(--success-bg); color: var(--success); }
		.badge-danger  { background: var(--danger-bg);  color: var(--danger); }
		.badge-warning { background: var(--warning-bg); color: var(--warning-text); }

		/* Block-level callouts for explanation or warning. For secondary detail
		   nobody needs up front, prefer .disclosure below. */
		.notice {
			border: 1px solid var(--border);
			border-left: 3px solid var(--primary);
			background: var(--surface-variant);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
			font-size: .875rem;
		}

		.notice-warning { border-left-color: var(--accent); background: var(--warning-bg); color: var(--warning-text); }
		.notice-danger  { border-left-color: var(--danger); background: var(--danger-bg);  color: var(--danger); }

		/* ---------- Disclosure ----------
		   Where methodology, references and shortcuts live. Collapsed by default
		   so it never competes with the tool. This replaces the page footer —
		   if there is nothing worth reading, omit the block entirely. */
		.disclosure {
			background: var(--surface-variant);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
		}

		.disclosure > summary {
			cursor: pointer;
			font-size: .875rem;
			font-weight: 600;
			color: var(--text-muted);
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			list-style: none;
			user-select: none;
		}

		.disclosure > summary::-webkit-details-marker { display: none; }

		.disclosure > summary::before {
			content: "";
			width: 0;
			height: 0;
			border-left: 5px solid currentColor;
			border-top: 4px solid transparent;
			border-bottom: 4px solid transparent;
			transition: transform .2s;
			flex-shrink: 0;
		}

		.disclosure[open] > summary::before { transform: rotate(90deg); }
		.disclosure > summary:hover { color: var(--primary); }
		.disclosure[open] > summary { margin-bottom: var(--sp-3); }

		.disclosure-body {
			font-size: .875rem;
			line-height: 1.7;
			color: var(--text-muted);
		}

		.disclosure-body > * + * { margin-top: var(--sp-3); }

		.disclosure-body ul,
		.disclosure-body ol { padding-left: 1.25rem; }

		.disclosure-body li + li { margin-top: var(--sp-1); }

		.disclosure-body pre,
		.disclosure-body code {
			font-family: var(--font-mono);
			font-size: .8125rem;
		}

		.disclosure-body pre {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			padding: var(--sp-3);
			white-space: pre-wrap;
			overflow-x: auto;
		}

		/* ---------- Settings dialog ----------
		   Every app has one, opened by the header's .btn-icon. Structure is
		   .sheet-header / .sheet-body / .sheet-footer; only the body scrolls.
		   Open and close it via AppSettings.wireSheet, never showModal directly,
		   or the no-<dialog> fallback below is bypassed. */
		dialog.sheet {
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			background: var(--surface);
			color: var(--text);
			padding: 0;
			width: min(420px, calc(100vw - 2rem));
			box-shadow: var(--shadow-2);
			margin: auto;
			/* The sheet itself never scrolls; .sheet-body is the only scroller,
			   otherwise the UA default max-height produces a second scrollbar. */
			max-height: calc(100vh - 2rem);
			max-height: calc(100dvh - 2rem);
			overflow: hidden;
		}

		dialog.sheet[open] {
			display: flex;
			flex-direction: column;
		}

		/* Works whether the sections are wrapped in a <form method="dialog">
		   or sit directly inside the dialog. */
		dialog.sheet > form {
			display: flex;
			flex-direction: column;
			flex: 1 1 auto;
			min-height: 0;
		}

		/* Literal colours, never var(): ::backdrop did not inherit from its
		   dialog before Chrome 122, so a custom property resolves to nothing,
		   the declaration is invalid, and the backdrop falls back to
		   transparent. That is the classic "dialog does not dim" bug. */
		dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .38);
		}

		@media (prefers-color-scheme: dark) {
			:root:not(.light) dialog.sheet::backdrop {
				background: rgba(0, 0, 0, .6);
			}
		}

		:root.dark dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .6);
		}

		/* Dimming. Two paths only:
		   1. ::backdrop — every browser that has modal <dialog>.
		   2. .sheet-scrim — a real element the script inserts when showModal()
		      is missing (pre-2022 Safari/Firefox).

		   Everything in path 2 must stay old-CSS-safe: no inset, no :where,
		   no @supports selector(). Those all postdate the browsers it serves,
		   which is exactly how the previous version silently did nothing. */

		/* No <dialog> support means no UA rule hiding a closed dialog, so the
		   sheet would sit inline in the page. Spell it out. */
		dialog.sheet:not([open]) {
			display: none;
		}

		html.has-open-sheet {
			overflow: hidden;
		}

		.sheet-scrim {
			position: fixed;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			background: var(--scrim);
			z-index: 998;
		}

		dialog.sheet-fallback {
			display: flex;
			position: fixed;
			top: 50%;
			left: 50%;
			right: auto;
			bottom: auto;
			-webkit-transform: translate(-50%, -50%);
			transform: translate(-50%, -50%);
			z-index: 999;
		}

		.sheet-header {
			flex: 0 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: var(--sp-4);
			padding: var(--sp-4) var(--sp-5);
			border-bottom: 1px solid var(--border);
		}

		.sheet-header h2 {
			font-size: 1.0625rem;
		}

		.sheet-body {
			padding: var(--sp-5);
			display: flex;
			flex-direction: column;
			gap: var(--sp-4);
			flex: 1 1 auto;
			min-height: 0;
			overflow-y: auto;
			overscroll-behavior: contain;
		}

		.sheet-footer {
			flex: 0 0 auto;
			padding: var(--sp-4) var(--sp-5);
			border-top: 1px solid var(--border);
			display: flex;
			justify-content: flex-end;
			gap: var(--sp-2);
		}

		/* ---------- Utilities ----------
		   Deliberately few. If you reach for a stack of these on one element,
		   the component is missing a class instead. */
		.hidden { display: none !important; }
		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
			border: 0;
		}
		.mono { font-family: var(--font-mono); }
		.muted { color: var(--text-muted); }
		.nums { font-variant-numeric: tabular-nums; }
		.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
		.grow { flex: 1; }

		/* ---------- Responsive ----------
		   Column counts are preserved on desktop and collapse predictably:
		   >=4 cols -> 2 cols on tablet -> 1 col on phone. */
		@media (max-width: 900px) {
			.row {
				grid-template-columns: repeat(min(var(--cols, 2), 2), minmax(0, 1fr));
			}
		}

		@media (max-width: 600px) {
			body {
				padding: var(--sp-4) var(--sp-3);
				gap: var(--sp-4);
			}

			.card {
				padding: var(--sp-4);
			}

			.app-header {
				gap: var(--sp-3);
				align-items: center;
				flex-wrap: nowrap;
			}

			/* full-width action buttons stack rather than squeeze */
			.row-flex > .grow {
				flex-basis: 100%;
			}

			.app-title-group h1 {
				font-size: 1.25rem;
			}

			.row {
				grid-template-columns: 1fr;
			}

			/* let tabs bleed to the card edge, but only inside a card */
			.card > .tabs,
			.card > * > .tabs {
				margin-inline: calc(var(--sp-4) * -1);
				padding-inline: var(--sp-4);
			}
		}

		/* =====================================================================
		   APP-SPECIFIC STYLES — the only part of this file you edit freely.

		   It sits after the core, so a plain selector beats the core's on equal
		   specificity: no !important needed. Two traps worth knowing:
		     · core .row sets align-items:start — restate it if you make .row flex
		     · a blanket `button { }` outranks .btn-icon; use
		       button:not(:where(.btn-icon)) so the Settings gear stays square

		   Pick the width tier below to match the content, not the screen:
		   720 single-column · 960 standard · 1200 wide · 1600 dense/two-rail
		   ===================================================================== */
		:root {
			--content-max: 720px;
		}

		#output {
			background: var(--surface-variant);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-4);
			font-size: 1.0625rem;
			line-height: 1.6;
		}

		#output:empty {
			display: none;
		}

		#output.error {
			background: var(--danger-bg);
			border-color: var(--danger);
			color: var(--danger);
		}

		#outputInfo:empty {
			display: none;
		}

		#input {
			min-height: 6.5rem;
			max-height: 24rem;
			resize: vertical;
			line-height: 1.5;
			field-sizing: content;
		}

		#output {
			overflow-wrap: anywhere;
			max-height: 28rem;
			overflow: auto;
		}
	</style>
</head>

<body>
	<!-- Header. Title and one-line subtitle on the left, Settings on the right.
	     The gear needs no label text: the shared script sets its accessible
	     name from the current language. -->
	<header class="app-header">
		<div class="app-title-group">
			<h1 id="title">Self-Referential Sentence Generator</h1>
			<p id="subtitle" class="app-subtitle">Completes your text with a phrase that correctly counts its own letters.</p>
		</div>
		<div class="app-controls">
			<button id="settingsBtn" class="btn-icon" type="button" aria-label="Settings" title="Settings">

	<!-- Main. One .card per logical group; the shell spaces them for you. -->

	<script>
		/* =====================================================================
		   SHARED SETTINGS BEHAVIOUR — identical in every app. Do not edit here.
		   Edit /shared-settings.js, then run sync_core.py.

		   Owns theme, language and the settings dialog so all apps behave the
		   same. Runs before app code, so window.AppSettings is ready by the time
		   an app's constructor executes.

		   An app is expected to:
		     1. set AppSettings.strings = <its translation table>
		     2. call AppSettings.detectLang(...) once to choose a start language
		     3. delegate its own theme()/lang() to applyTheme()/applyLang()
		   Persistence stays with the app; this layer never touches storage.
		   ===================================================================== */
		(function () {
			const root = document.documentElement;
			const $ = id => document.getElementById(id);

			/* Last-resort settings copy, used key-by-key when the app has no
			   translation table (or is missing a key). Keeps apps without an i18n
			   layer looking identical to those with one. */
			const FALLBACK = {
				en: { prefTitle: 'Settings', prefBtn: 'Settings', langLabel: 'Language',
					themeLabel: 'Theme', themeAuto: 'Auto', themeLight: 'Light', themeDark: 'Dark' },
				id: { prefTitle: 'Pengaturan', prefBtn: 'Pengaturan', langLabel: 'Bahasa',
					themeLabel: 'Tema', themeAuto: 'Otomatis', themeLight: 'Terang', themeDark: 'Gelap' }
			};

			const AppSettings = {
				/* The app's table, shaped { en: ..., id: ... }. Assign it as soon as it
				   is defined — renderSettings reads it on the first applyLang. */
				strings: null,
				/* Applies a theme and returns the value actually used.
				   'auto' clears both classes and defers to prefers-color-scheme.
				   Idempotent; also syncs the #theme select and fires 'themechange' on
				   <html> for canvas apps that must repaint. */
				applyTheme(value) {
					const v = (value === 'light' || value === 'dark') ? value : 'auto';
					root.classList.remove('light', 'dark');
					if (v !== 'auto') root.classList.add(v);
					const sel = $('theme');
					if (sel && sel.value !== v) sel.value = v;
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: v } }));
					return v;
				},

				/* Switches language: updates <html lang>, the #language select and the
				   dialog copy. Returns the value applied. Call this from the app's own
				   lang() rather than touching <html> directly. */
				applyLang(value) {
					const sel = $('language');
					const v = value || (sel && sel.value) || 'en';
					root.lang = v;
					if (sel && sel.value !== v) sel.value = v;
					this.renderSettings(v);
					return v;
				},

				/* Repaints the dialog copy: title, both field labels, the three theme
				   option names, and the trigger's accessible name. Driven entirely by ids
				   (#prefTitle, #langLabel, #themeLabel), so markup needs the right ids and
				   nothing else. */
				renderSettings(lang) {
					const l = lang || root.lang || 'en';
					const app = (this.strings && this.strings[l]) || {};
					const base = FALLBACK[l] || FALLBACK.en;
					const s = {};
					for (const k of Object.keys(FALLBACK.en)) s[k] = app[k] || base[k] || FALLBACK.en[k];

					['prefTitle', 'langLabel', 'themeLabel'].forEach(id => {
						const e = $(id);
						if (e) e.textContent = s[id];
					});

					const sel = $('theme');
					if (sel) [...sel.options].forEach(o => {
						const k = 'theme' + o.value.charAt(0).toUpperCase() + o.value.slice(1);
						if (s[k]) o.textContent = s[k];
					});

					['settingsBtn', 'prefBtn', 'openSettings'].forEach(id => {
						const b = $(id);
						if (b) { b.setAttribute('aria-label', s.prefBtn); b.title = s.prefBtn; }
					});
					return s;
				},

				/* Best browser language the app actually ships, e.g.
				   detectLang(Object.keys(text)). Walks navigator.languages in order and
				   matches region subtags ('id-ID' -> 'id'); falls back to list[0]. */
				detectLang(available) {
					const list = (available && available.length) ? available : ['en'];
					const tags = (navigator.languages && navigator.languages.length)
						? navigator.languages : [navigator.language || 'en'];
					for (const tag of tags) {
						const t = String(tag).toLowerCase();
						const hit = list.find(l => t === String(l).toLowerCase()
							|| t.startsWith(String(l).toLowerCase() + '-'));
						if (hit) return hit;
					}
					return list[0];
				}
			};

			/* Modal <dialog> landed in Safari 15.4 / Firefox 98. Older engines get a
			   non-modal open plus our own scrim, stacking and scroll lock, so the
			   dialog still dims the page instead of appearing inline. */
			const CAN_MODAL = typeof HTMLDialogElement !== 'undefined'
				&& typeof HTMLDialogElement.prototype.showModal === 'function';

			/* The scrim is a real node, not a root pseudo-element, so it needs no
			   modern CSS and can take the click-to-close itself. */
			function addScrim(dialog) {
				var scrim = document.querySelector('.sheet-scrim');
				if (!scrim) {
					scrim = document.createElement('div');
					scrim.className = 'sheet-scrim';
					document.body.appendChild(scrim);
				}
				scrim.onclick = function () { AppSettings.closeSheet(dialog); };
			}

			function removeScrim() {
				var scrim = document.querySelector('.sheet-scrim');
				if (scrim && scrim.parentNode) scrim.parentNode.removeChild(scrim);
			}

			/* Don't assume ::backdrop painted — engines differ on whether it can be
			   styled and whether it inherits. Measure it, and supply our own scrim
			   when it came out transparent, whatever the reason. */
			function backdropPaints(dialog) {
				var bg;
				try { bg = window.getComputedStyle(dialog, '::backdrop').backgroundColor; }
				catch (e) { return false; }
				if (!bg || bg === 'transparent' || bg === 'none') return false;
				var parts = bg.replace(/\s+/g, '').match(/^rgba?\(([^)]+)\)$/);
				if (!parts) return true;                       // named or hex: it paints
				var channels = parts[1].split(',');
				return channels.length < 4 || parseFloat(channels[3]) > 0;
			}

			AppSettings.openSheet = function (dialog) {
				if (!dialog) return;
				if (CAN_MODAL) {
					try {
						if (!dialog.open) dialog.showModal();
						if (!backdropPaints(dialog)) addScrim(dialog);
						return;
					} catch (e) { /* wedged dialog: fall through and open it manually */ }
				}
				dialog.setAttribute('open', '');
				dialog.classList.add('sheet-fallback');
				root.classList.add('has-open-sheet');
				addScrim(dialog);
			};

			AppSettings.closeSheet = function (dialog) {
				if (!dialog) return;
				if (CAN_MODAL) {
					if (dialog.open) dialog.close();
					return;
				}
				dialog.removeAttribute('open');
				dialog.classList.remove('sheet-fallback');
				root.classList.remove('has-open-sheet');
				removeScrim();
			};

			/* Wires a trigger + dialog pair once: open on click, close on backdrop
			   click, plus — on the fallback path only — Escape and form submit, which
			   native <dialog> already handles. Use this for every dialog; calling
			   showModal() directly skips the fallback. */
			AppSettings.wireSheet = function (btn, dialog) {
				if (!btn || !dialog || dialog.dataset.sheetWired) return;
				dialog.dataset.sheetWired = '1';
				btn.addEventListener('click', () => AppSettings.openSheet(dialog));
				dialog.addEventListener('click', e => {
					if (e.target === dialog) AppSettings.closeSheet(dialog);
				});
				dialog.addEventListener('close', () => {
					dialog.classList.remove('sheet-fallback');
					root.classList.remove('has-open-sheet');
					removeScrim();
				});
				if (!CAN_MODAL) {
					dialog.addEventListener('submit', e => { e.preventDefault(); AppSettings.closeSheet(dialog); });
					document.addEventListener('keydown', e => {
						if (e.key === 'Escape' && dialog.hasAttribute('open')) AppSettings.closeSheet(dialog);
					});
				}
			};

			window.AppSettings = AppSettings;

			/* CSS reacts to an OS scheme change on its own; this only re-fires
			   'themechange' so canvas apps (which bake colours into pixels) know to
			   redraw. Silent unless the user is on 'auto'. */
			window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
				const sel = $('theme');
				if (!sel || sel.value === 'auto') {
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: 'auto' } }));
				}
			});

			document.addEventListener('DOMContentLoaded', () => {
				/* Baseline wiring so a bare #theme / #language select works with no app
				   code at all. Apps with their own handlers keep them — both run, and
				   apply* are idempotent. */
				const themeSel = $('theme');
				if (themeSel) {
					themeSel.addEventListener('change', e => AppSettings.applyTheme(e.target.value));
					AppSettings.applyTheme(themeSel.value);
				}
				const langSel = $('language');
				if (langSel) {
					langSel.addEventListener('change', e => AppSettings.applyLang(e.target.value));
					AppSettings.applyLang(langSel.value);
				} else {
					AppSettings.renderSettings();
				}

				/* The conventional pair. Apps using other ids (HijriCalc,
				   OpenDensityTool) call wireSheet themselves. */
				AppSettings.wireSheet($('settingsBtn'), $('settingsDialog'));
			});
		})();
	</script>

	<script>
		/* ============ App logic ============
		   Theme, language and the dialog are handled by the shared layer above.

		   Fifteen languages. Each one contributes three things:
		     1. UI copy in `text` — including the seven settings keys, because the
		        shared FALLBACK only ships en/id.
		     2. A number speller in `words`.
		     3. A `tail` builder: the numeral, the word for "letters" in whatever
		        form that number demands, and the sentence terminator.

		     · ru             — буква / буквы / букв by the 1–2/4–many rule
		     · ar             — full tamyīz: حرفان for 2, أحرف for 3–10,

				prefTitle: 'Ajustes', prefBtn: 'Ajustes', langLabel: 'Idioma',

			},
			ar: {
				title: 'مولّد الجمل ذاتية الإشارة',

		const RTL = ['ar', 'ur', 'fa'];

		/* ---------- Number spellers ----------
		   Each returns the numeral in the form the counted noun requires.
		   Scales go through hundreds of millions so a long pasted paragraph
		   still gets an exact count instead of “more than nine thousand”. */
		const ruAgree = (n, one, few, many) => {
			const m10 = n % 10, m100 = n % 100;
			if (m10 === 1 && m100 !== 11) return one;
			if (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) return few;
			return many;
		};

		const words = {
			id(n) {
				const u = ['nol', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
				if (n < 12) return u[n];
				if (n < 20) return `${u[n % 10]} belas`;
				if (n < 100) return `${u[Math.floor(n / 10)]} puluh${n % 10 ? ' ' + u[n % 10] : ''}`;
				if (n < 200) return `seratus${n > 100 ? ' ' + words.id(n % 100) : ''}`;
				if (n < 1000) return `${u[Math.floor(n / 100)]} ratus${n % 100 ? ' ' + words.id(n % 100) : ''}`;
			if (n < 2000) return `seribu${n > 1000 ? ' ' + words.id(n % 1000) : ''}`;
			if (n < 1000000) return `${words.id(Math.floor(n / 1000))} ribu${n % 1000 ? ' ' + words.id(n % 1000) : ''}`;
			if (n < 1000000000) {
				const m = Math.floor(n / 1000000), r = n % 1000000;
				const pre = m === 1 ? 'satu juta' : `${words.id(m)} juta`;
				return r ? `${pre} ${words.id(r)}` : pre;
			}
			return 'lebih dari sembilan ratus sembilan puluh sembilan juta';
		},

			en(n) {
				const u = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten',
					'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
				const t = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
				if (n < 20) return u[n];
				if (n < 100) return `${t[Math.floor(n / 10)]}${n % 10 ? '-' + u[n % 10] : ''}`;
			if (n < 1000) return `${u[Math.floor(n / 100)]} hundred${n % 100 ? ' ' + words.en(n % 100) : ''}`;
			if (n < 1000000) return `${words.en(Math.floor(n / 1000))} thousand${n % 1000 ? ' ' + words.en(n % 1000) : ''}`;
			if (n < 1000000000) return `${words.en(Math.floor(n / 1000000))} million${n % 1000000 ? ' ' + words.en(n % 1000000) : ''}`;
			return 'more than nine hundred ninety-nine million';
		},

			/* feminine: una, veintiuna, doscientas — "letra" is feminine */
			es(n) {
				const u = ['cero', 'una', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez',

					'veintisiete', 'veintiocho', 'veintinueve'];
				const t = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
				const h = ['', 'ciento', 'doscientas', 'trescientas', 'cuatrocientas', 'quinientas', 'seiscientas',
					'setecientas', 'ochocientas', 'novecientas'];
				if (n < 30) return u[n];
				if (n < 100) return `${t[Math.floor(n / 10)]}${n % 10 ? ' y ' + u[n % 10] : ''}`;
			if (n === 100) return 'cien';
			if (n < 1000) return `${h[Math.floor(n / 100)]}${n % 100 ? ' ' + words.es(n % 100) : ''}`;
			if (n < 2000) return `mil${n % 1000 ? ' ' + words.es(n % 1000) : ''}`;
			if (n < 1000000) return `${words.es(Math.floor(n / 1000))} mil${n % 1000 ? ' ' + words.es(n % 1000) : ''}`;
			if (n < 1000000000) {
				const m = Math.floor(n / 1000000), r = n % 1000000;
				const pre = m === 1 ? 'un millón' : `${words.es(m)} millones`;
				return r ? `${pre} ${words.es(r)}` : pre;

			return 'más de novecientas noventa y nueve millones';
		},

			/* feminine: une, vingt et une, quatre-vingt-une — "lettre" is feminine */
			fr(n) {

					'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];
				const t = { 2: 'vingt', 3: 'trente', 4: 'quarante', 5: 'cinquante', 6: 'soixante' };

			if (n === 100) return 'cem';
			if (n < 1000) return `${h[Math.floor(n / 100)]}${n % 100 ? ' e ' + words.pt(n % 100) : ''}`;
			if (n < 2000) return `mil${n % 1000 ? ' e ' + words.pt(n % 1000) : ''}`;
			if (n < 1000000) {
				const tn = Math.floor(n / 1000), r = n % 1000;
				const head = tn < 10 ? m_u[tn] : words.pt(tn).replace(/uma\b/g, 'um').replace(/duas\b/g, 'dois');

			it: n => `${words.it(n)} ${n === 1 ? 'lettera' : 'lettere'}.`,

			/* singular noun after any numeral ending in "ein": ein Buchstabe,
			   einhundertein Buchstabe — but einundzwanzig Buchstaben */
			de(n) {
				const w = words.de(n);
				return `${w} ${w.endsWith('ein') ? 'Buchstabe' : 'Buchstaben'}.`;
			},

			/* 1 буква · 2–4 буквы · 5–20 букв, with the 11–14 exception */
			ru(n) {
				const mod10 = n % 10, mod100 = n % 100;
				const noun = (mod10 === 1 && mod100 !== 11) ? 'буква'
					: (mod10 >= 2 && mod10 <= 4 && !(mod100 >= 12 && mod100 <= 14)) ? 'буквы'
						: 'букв';
				return `${words.ru(n)} ${noun}.`;
			},

			/* Arabic counted-noun agreement (tamyīz):
			   1 حرف واحد · 2 حرفان · 3–10 plural genitive · 11–99 singular
			   accusative · 100+ singular genitive */
			ar(n) {
				if (n === 1) return 'حرف واحد.';
				if (n === 2) return 'حرفان.';
				if (n <= 10) return `${words.ar(n)} أحرف.`;
				if (n % 100 === 0 || (n > 100 && n % 100 === 0)) return `${words.ar(n)} حرف.`;
				if (n < 100) return `${words.ar(n)} حرفًا.`;
				const r = n % 100;
				if (r === 1 || r === 2) return `${words.ar(n)} حرف.`;
				return `${words.ar(n)} ${r <= 10 ? 'أحرف' : 'حرفًا'}.`;
			}
		};

		const elements = new Proxy({}, { get: (_, id) => document.getElementById(id) });

		/* Unicode-aware: Arabic, Cyrillic, Vietnamese diacritics and ß all count
		   as letters; combining marks (Arabic harakat) do not. */
		const countLetters = value => value.match(/\p{L}/gu)?.length ?? 0;

		/* ---------- The search ----------
		 The sentence is always `${input} ${tail(n)}`, and the input does not
		 change while we search, so

		     letters(sentence) = base + letters(tail(n)),   base = letters(input)

		 A candidate is judged from its tail alone — the (possibly very long)
		 opening clause is counted once. A solution is any n with
		 n = base + letters(tail(n)). Because a tail has at least one letter,
		 n cannot sit below base, so the scan starts at max(base, 1) and walks
		 upward. The smallest solution therefore wins.

		 MAX_ITERATIONS (1000) is the search budget: every generate() evaluates
		 at most that many distinct n, and an unsuccessful run reports the full
		 1000 rather than stopping after the first tight neighbourhood. Number
		 words at this magnitude are tens of letters long, so a 1000-wide window
		 is far wider than any feasible tail.

		 Tails are memoised per language, so re-running — switching language,
		 generating again, hitting Example — reuses the counts. */
		const MAX_ITERATIONS = 1000;
		const tailCache = new Map();

		function tailFor(lang, n) {
			const key = `${lang}:${n}`;
			let entry = tailCache.get(key);
			if (entry === undefined) {
				const value = (tail[lang] || tail.en)(n);
				entry = { value, letters: countLetters(value) };
				tailCache.set(key, entry);
			}
			return entry;
		}

		const SentenceGenerator = {
			generate(input, lang) {
				const base = countLetters(input);
				let n = Math.max(base, 1);

				for (let step = 1; step <= MAX_ITERATIONS; step++) {
					const entry = tailFor(lang, n);
					if (base + entry.letters === n) {
						return { sentence: `${input} ${entry.value}`, stable: true, iterations: step };
					}
					n++;
				}

				return {
					sentence: `${input} ${(text[lang] || text.en).unableToGenerate}`,
					stable: false,
					iterations: MAX_ITERATIONS
				};
			}
		};

		class SentenceApp {
			constructor() {
				AppSettings.strings = text;
				this.language = AppSettings.detectLang(Object.keys(text));
				this.setup();
				this.lang(this.language);
			}

			setup() {
				elements.language.addEventListener('change', e => this.lang(e.target.value));
				elements.input.addEventListener('keydown', e => {
					if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
						e.preventDefault();
						this.generateSentence();
					}
				});
				elements.generate.addEventListener('click', () => this.generateSentence());
				elements.exampleBtn.addEventListener('click', () => {
					elements.input.value = this.string('placeholder');
					this.generateSentence();
				});
				if (elements.copyBtn) {
					elements.copyBtn.addEventListener('click', () => this.copyResult());
				}
			}

			string(key) { return text[this.language]?.[key] ?? text.en[key] ?? key; }

			lang(language) {
				const previousExample = text[this.language]?.placeholder;
				this.language = AppSettings.applyLang(language);

				['title', 'subtitle', 'labelInput', 'inputHint', 'generate', 'exampleBtn', 'resultTitle', 'copyBtn']
					.forEach(key => {
						if (elements[key]) elements[key].textContent = this.string(key);
					});
				document.title = this.string('title');
				elements.input.placeholder = this.string('placeholder');

				// Arabic and Urdu flip the whole shell, not just the result text.
				document.documentElement.dir = RTL.includes(this.language) ? 'rtl' : 'ltr';

				// A sentence only counts its own letters in the language it was
				// built for, so re-run it — or clear it if the text was ours.
				if (elements.input.value.trim() === previousExample) {
					elements.input.value = this.string('placeholder');
				}
				if (elements.output.textContent.trim()) this.generateSentence();
			}

			generateSentence() {
				const input = elements.input.value.trim();
				if (!input) {
					this.showError(this.string('errorEmpty'));
					return;
				}
				this.showResult(SentenceGenerator.generate(input, this.language));
			}

			async copyResult() {
				const sentence = elements.output.textContent.trim();
				if (!sentence) return;
				try {
					await navigator.clipboard.writeText(sentence);
					if (elements.copyBtn) {
						elements.copyBtn.textContent = this.string('copied');
						setTimeout(() => {
							if (elements.copyBtn) elements.copyBtn.textContent = this.string('copyBtn');
						}, 2000);
					}
				} catch (e) {
					/* Clipboard access denied or unsupported */
				}
			}

			showError(message) {
				elements.output.textContent = message;
				elements.output.classList.add('error');
				elements.outputInfo.textContent = '';
				if (elements.copyBtn) elements.copyBtn.classList.add('hidden');
			}

			showResult(result) {
				elements.output.textContent = result.sentence;
				elements.output.classList.toggle('error', !result.stable);
				elements.outputInfo.textContent = result.stable
					? this.string('stableInfo')(result.iterations)
					: this.string('unstableInfo')(result.iterations);
				if (elements.copyBtn) {
					elements.copyBtn.classList.toggle('hidden', !result.stable);
					elements.copyBtn.textContent = this.string('copyBtn');
				}
			}
		}

		new SentenceApp();
	</script>
</body>
</html>
